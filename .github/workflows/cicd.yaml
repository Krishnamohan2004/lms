name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lms-ecr
  EKS_CLUSTER_NAME: lms-eks
  K8S_NAMESPACE: lms
  APP_NAME: apigateway

jobs:

  # ============================================================
  # JOB 1 - BUILD SPRING BOOT APPLICATION
  # ============================================================

  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apigateway

    steps:

      # ----------------------------------------------------------
      # Checkout code
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Java 17
      # ----------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ----------------------------------------------------------
      # Check project
      # ----------------------------------------------------------

      - name: Check Project
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "pom.xml:"
          ls -lh pom.xml

      # ----------------------------------------------------------
      # Maven Validate
      # ----------------------------------------------------------

      - name: Ensure `mvnw` is executable
        run: |
          chmod +x mvnw

      - name: Maven Validate
        run: |
          ./mvnw validate

      # ----------------------------------------------------------
      # Maven Compile
      # ----------------------------------------------------------

      - name: Maven Compile
        run: |
          ./mvnw clean compile

      # ----------------------------------------------------------
      # Maven Test
      # ----------------------------------------------------------

      - name: Maven Test
        run: |
          ./mvnw test

      # ----------------------------------------------------------
      # Maven Package
      # ----------------------------------------------------------

      - name: Maven Package
        run: |
          ./mvnw clean package -DskipTests

      # ----------------------------------------------------------
      # Verify JAR
      # ----------------------------------------------------------

      - name: Verify JAR
        run: |
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          ls -lh target/

          echo ""
          echo "JAR files:"
          find target -type f -name "*.jar" -print

          JAR_COUNT=$(find target -type f -name "*.jar" | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: No JAR file found"
            exit 1
          fi

          echo ""
          echo "JAR successfully created."

      # ----------------------------------------------------------
      # Upload JAR
      # ----------------------------------------------------------

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: apigateway/target/*.jar


  # ============================================================
  # JOB 2 - DOCKER BUILD AND PUSH TO ECR
  # ============================================================

  docker:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    needs: build

    steps:

      # ----------------------------------------------------------
      # Checkout code
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Download JAR artifact
      # ----------------------------------------------------------

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: apigateway/target

      # ----------------------------------------------------------
      # Verify downloaded JAR
      # ----------------------------------------------------------

      - name: Verify JAR
        run: |
          echo "=========================================="
          echo "DOWNLOADED JAR"
          echo "=========================================="

          ls -lh apigateway/target/

          echo ""
          echo "JAR files:"
          find apigateway/target -type f -name "*.jar" -print

      # ----------------------------------------------------------
      # Check Dockerfile
      # ----------------------------------------------------------

      - name: Check Dockerfile
        run: |
          echo "=========================================="
          echo "DOCKERFILE"
          echo "=========================================="

          cat apigateway/Dockerfile

      # ----------------------------------------------------------
      # Check Docker build context
      # ----------------------------------------------------------

      - name: Check Docker Build Context
        run: |
          echo "=========================================="
          echo "DOCKER BUILD CONTEXT"
          echo "=========================================="

          echo "Directory:"
          pwd

          echo ""
          echo "apigateway directory:"
          ls -la apigateway/

          echo ""
          echo "target directory:"
          ls -lh apigateway/target/

      # ----------------------------------------------------------
      # Configure AWS credentials
      # ----------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Check AWS identity
      # ----------------------------------------------------------

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # Get AWS Account ID
      # ----------------------------------------------------------

      - name: Get AWS Account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          echo "AWS Account ID:"
          echo "$ACCOUNT_ID"

      # ----------------------------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # ----------------------------------------------------------
      # Verify ECR repository
      # ----------------------------------------------------------

      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      # ----------------------------------------------------------
      # Create image URI
      # ----------------------------------------------------------

      - name: Create Image URI
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          LATEST_IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=$LATEST_IMAGE" >> "$GITHUB_ENV"

          echo "Versioned Image:"
          echo "$IMAGE_URI"

          echo ""
          echo "Latest Image:"
          echo "$LATEST_IMAGE"

      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------

      - name: Build Docker Image
        run: |
          echo "=========================================="
          echo "BUILDING DOCKER IMAGE"
          echo "=========================================="

          docker build \
            -f apigateway/Dockerfile \
            -t "$IMAGE_URI" \
            apigateway

      # ----------------------------------------------------------
      # Push versioned image
      # ----------------------------------------------------------

      - name: Push Docker Image
        run: |
          echo "Pushing:"
          echo "$IMAGE_URI"

          docker push "$IMAGE_URI"

      # ----------------------------------------------------------
      # Tag latest
      # ----------------------------------------------------------

      - name: Tag Latest Image
        run: |
          docker tag \
            "$IMAGE_URI" \
            "$LATEST_IMAGE"

      # ----------------------------------------------------------
      # Push latest image
      # ----------------------------------------------------------

      - name: Push Latest Image
        run: |
          echo "Pushing:"
          echo "$LATEST_IMAGE"

          docker push "$LATEST_IMAGE"

      # ----------------------------------------------------------
      # Display result
      # ----------------------------------------------------------

      - name: Docker Image Information
        run: |
          echo "=========================================="
          echo "DOCKER IMAGE PUSHED SUCCESSFULLY"
          echo "=========================================="

          echo "Versioned Image:"
          echo "$IMAGE_URI"

          echo ""
          echo "Latest Image:"
          echo "$LATEST_IMAGE"
